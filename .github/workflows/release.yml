name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "blender_studio.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.2.5)"
        required: false
        default: ""
      draft:
        description: "Create draft release"
        type: boolean
        default: false
      prerelease:
        description: "Create prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Build distribution packages and icons
        run: python scripts/build_dist.py

      - name: Run validation tests
        run: python scripts/test_plugin.py

      - name: Determine tag name
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(python3 -c "import re; print(re.search(r'PLUGIN_VERSION\s*=\s*[\"\\\']([^\"\\\']+)[\"\\\']', open('blender_studio.py').read()).group(1))")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag will be: ${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Blender Studio ${{ steps.vars.outputs.tag }}"
          body_path: dist/latest_changelog.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: false
          files: |
            dist/blender_studio_any.py
            dist/blender_studio_linux_x86_64.py
            dist/blender_studio_win_x86_64.py
            dist/blender_studio_macosx_arm64.py
            dist/blender_studio_macosx_x86_64.py
            dist/icon.png
            dist/icon_256x256.png
            dist/icon.svg
            dist/blender_studio_v*.zip
            dist/SHA256SUMS.txt
            dist/CHANGELOG.txt
            dist/hub_hero_banner.png
            dist/workflow_pipeline.png
            dist/diagnostic_views_showcase.png
