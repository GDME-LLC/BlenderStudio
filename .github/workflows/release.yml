name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.2.6)"
        required: false
        default: ""
      draft:
        description: "Create draft release"
        type: boolean
        default: false
      prerelease:
        description: "Create prerelease"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Build distribution packages and icons
        run: python scripts/build_dist.py

      - name: Run validation tests
        run: python scripts/test_plugin.py

      - name: Determine tag name
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            VERSION="${TAG#v}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION=$(python3 scripts/generate_changelog.py --version-only)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release tag will be: ${TAG}"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Blender Studio ${{ steps.vars.outputs.tag }}"
          body_path: dist/latest_changelog.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: false
          make_latest: true
          files: |
            dist/blender_studio_any.py
            dist/blender_studio_linux_x86_64.py
            dist/blender_studio_win_x86_64.py
            dist/blender_studio_macosx_arm64.py
            dist/blender_studio_macosx_x86_64.py
            dist/icon.png
            dist/icon_256x256.png
            dist/icon.svg
            dist/blender_studio_v*.zip
            dist/SHA256SUMS.txt
            dist/CHANGELOG.txt
            dist/hub_hero_banner.png
            dist/workflow_pipeline.png
            dist/diagnostic_views_showcase.png

      - name: Publish to Orca Cloud Plugin Hub
        continue-on-error: true
        run: |
          echo "Attempting trusted publishing to Orca Cloud..."
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            OIDC_TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=orcacloud" | jq -r '.value // empty')
            if [ -n "$OIDC_TOKEN" ]; then
              echo "Posting release to Orca Cloud API..."
              curl -sS -X POST "https://api.orcaslicer.com/api/v1/plugin-publish/releases" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -F "file=@dist/blender_studio_any.py" \
                -F "changelog=@dist/latest_changelog.md" \
                -F "version=${{ steps.vars.outputs.version }}" || echo "Orca Cloud API response recorded."
            else
              echo "OIDC token could not be minted."
            fi
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN not provided in environment."
          fi
