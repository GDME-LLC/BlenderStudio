<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D222D"/>
      <stop offset="50%" stop-color="#14171F"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4456"/>
      <stop offset="50%" stop-color="#232A36"/>
      <stop offset="100%" stop-color="#1A1F28"/>
    </linearGradient>

    <!-- Top Face (Orca Teal Buildplate) -->
    <linearGradient id="topFaceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#133D3A"/>
      <stop offset="100%" stop-color="#1E5752"/>
    </linearGradient>

    <!-- Left Face (Technical CAD Slate) -->
    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222C3D"/>
      <stop offset="100%" stop-color="#131924"/>
    </linearGradient>

    <!-- Right Face (Blender Warm Charcoal) -->
    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#382417"/>
      <stop offset="100%" stop-color="#1E1510"/>
    </linearGradient>

    <!-- Blender Orange Glow -->
    <linearGradient id="blenderOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA733"/>
      <stop offset="60%" stop-color="#E87D0D"/>
      <stop offset="100%" stop-color="#C75F00"/>
    </linearGradient>

    <!-- Orca Teal Glow -->
    <linearGradient id="orcaTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EE2D0"/>
      <stop offset="100%" stop-color="#26A69A"/>
    </linearGradient>

    <!-- Eye Pupil Gradient -->
    <radialGradient id="eyePupil" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5CE5D6"/>
      <stop offset="70%" stop-color="#1E8D82"/>
      <stop offset="100%" stop-color="#0F544D"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle with Outer Glow -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Isometric 3D CAD Cube Center at (256, 274), Radius=155 -->
  <!-- Top Face -->
  <polygon points="256,124 390,201 256,278 122,201" fill="url(#topFaceGrad)" stroke="#26A69A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Top Face Buildplate Grid Lines -->
  <g stroke="#26A69A" stroke-opacity="0.4" stroke-width="1.6">
    <!-- Iso Grid Lines -->
    <line x1="155" y1="182" x2="289" y2="259"/>
    <line x1="189" y1="163" x2="323" y2="240"/>
    <line x1="222" y1="143" x2="356" y2="220"/>
    <line x1="189" y1="240" x2="323" y2="163"/>
    <line x1="222" y1="259" x2="356" y2="182"/>
    <line x1="155" y1="220" x2="289" y2="143"/>
  </g>

  <!-- Left Face -->
  <polygon points="122,201 256,278 256,432 122,355" fill="url(#leftFaceGrad)" stroke="#26A69A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left Face Dimension Ticks -->
  <g stroke="#4A607D" stroke-opacity="0.35" stroke-width="1.4">
    <line x1="122" y1="240" x2="256" y2="317"/>
    <line x1="122" y1="278" x2="256" y2="355"/>
    <line x1="122" y1="317" x2="256" y2="394"/>
  </g>

  <!-- Right Face -->
  <polygon points="256,278 390,201 390,355 256,432" fill="url(#rightFaceGrad)" stroke="#E87D0D" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right Face Ticks -->
  <g stroke="#E87D0D" stroke-opacity="0.35" stroke-width="1.4">
    <line x1="256" y1="317" x2="390" y2="240"/>
    <line x1="256" y1="355" x2="390" y2="278"/>
    <line x1="256" y1="394" x2="390" y2="317"/>
  </g>

  <!-- Outer Isometric Cube Accent Edges -->
  <polyline points="256,124 122,201 122,355 256,432" fill="none" stroke="url(#orcaTeal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="256,124 390,201 390,355 256,432" fill="none" stroke="url(#blenderOrange)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three Coordinate Axis Rays from Mid Point (256, 278) -->
  <line x1="256" y1="278" x2="256" y2="124" stroke="url(#orcaTeal)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="256" y1="278" x2="122" y2="355" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="256" y1="278" x2="390" y2="355" stroke="url(#blenderOrange)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 3D Print Nozzle Symbol at Top Vertex (256, 124) -->
  <polygon points="242,94 270,94 264,112 259,120 253,120 248,112" fill="#E5A50A" stroke="#FFD54F" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="256" cy="124" r="4.5" fill="#4EE2D0" filter="url(#glow)"/>

  <!-- Center Blender Vortex & Eye Emblem (Anchored at Center 256, 274) -->
  <!-- Outer Energy Arms -->
  <g stroke="url(#blenderOrange)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arm 1: Top-Left Curve -->
    <path d="M256,274 C230,230 195,215 178,210"/>
    <!-- Arm 2: Top-Right Curve -->
    <path d="M256,274 C285,235 320,225 342,228"/>
    <!-- Arm 3: Bottom Curve -->
    <path d="M256,274 C265,325 258,355 248,375"/>
  </g>

  <!-- Arm Terminal Glow Dots -->
  <circle cx="178" cy="210" r="8" fill="#FFA733"/>
  <circle cx="342" cy="228" r="8" fill="#FFA733"/>
  <circle cx="248" cy="375" r="8" fill="#FFA733"/>

  <!-- Center Orange Outer Eye Ring -->
  <circle cx="256" cy="274" r="42" fill="url(#blenderOrange)" stroke="#FFCF70" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Inner Dark Iris Socket -->
  <circle cx="256" cy="274" r="28" fill="#12151B" stroke="#FFA733" stroke-width="2"/>

  <!-- Glowing Orca Teal Core Pupil -->
  <circle cx="256" cy="274" r="17" fill="url(#eyePupil)" stroke="#78F2E4" stroke-width="1.8"/>

  <!-- Specular Spark Highlight -->
  <circle cx="250" cy="268" r="4.5" fill="#FFFFFF"/>
</svg>
